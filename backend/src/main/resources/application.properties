spring.application.name=estude-noah-backend
server.address=0.0.0.0
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:51MB}
security.app-check.enabled=${APP_CHECK_ENABLED:true}
security.auth.mode=${BACKEND_AUTH_MODE:firebase_auth}
security.auth.allow-none=${ALLOW_AUTH_NONE:false}
security.firebase.allowed-uids=${ALLOWED_FIREBASE_UIDS:}
firebase.project-id=${FIREBASE_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
security.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:30}
security.payload.max-json-bytes=${MAX_JSON_BYTES:1048576}
security.payload.max-upload-bytes=${MAX_UPLOAD_BYTES:53477376}
material-url.allowed-hosts=${MATERIAL_URL_ALLOWED_HOSTS:brasilescola.uol.com.br,*.jesuitasbrasil.org.br}
