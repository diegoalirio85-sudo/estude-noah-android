name: Backend - Build e Testes

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar e testar backend
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Construir container
        working-directory: backend
        run: docker build --tag estude-noah-backend:ci .

      - name: Informar tamanho da imagem
        run: docker image inspect estude-noah-backend:ci --format='{{.Size}} bytes'
