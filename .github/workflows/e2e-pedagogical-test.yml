name: E2E Pedagógico - Gemini

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: URL pública do vídeo no YouTube
        required: true
        default: https://www.youtube.com/watch?v=5gX6rsce1ds&t=2s
        type: string
      subject:
        description: Disciplina da atividade
        required: true
        default: Língua Portuguesa
        type: string
      grade:
        description: Ano escolar
        required: true
        default: 4º Ano Ensino Fundamental
        type: string

jobs:
  e2e-pedagogical:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
      E2E_OUTPUT: e2e-output

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Preparar diretório de resultados
        run: mkdir -p "$E2E_OUTPUT"

      - name: Verificar segredo Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Configure GEMINI_API_KEY in repository Actions secrets."
            exit 1
          fi

      - name: Compilar e executar testes normais do backend
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Iniciar backend local
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          nohup java -jar backend/target/estude-noah-backend-0.1.0-SNAPSHOT.jar \
            > "$RUNNER_TEMP/estude-noah-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/estude-noah-backend.pid"

      - name: Aguardar saúde do backend
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/health \
              | jq -e '.status == "ok"' > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check did not become ready."
          exit 1

      - name: Executar C1 e C2 com Gemini real
        id: e2e
        continue-on-error: true
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          SUBJECT: ${{ inputs.subject }}
          GRADE: ${{ inputs.grade }}
        run: |
          c1_start=$(date +%s)
          c1_status=$(curl --silent --show-error \
            --output "$E2E_OUTPUT/analysis.json" \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg url "$YOUTUBE_URL" '{url:$url}')" \
            http://127.0.0.1:8080/v1/materials/youtube/analyze)
          c1_end=$(date +%s)
          echo "$((c1_end - c1_start))" > "$E2E_OUTPUT/c1-duration-seconds.txt"

          if [ "$c1_status" -lt 200 ] || [ "$c1_status" -ge 300 ]; then
            echo "C1 returned HTTP $c1_status."
            exit 1
          fi
          jq -e 'type == "object" and (.summary | type == "string" and length > 0) and (.themes | type == "array" and length > 0)' \
            "$E2E_OUTPUT/analysis.json" > /dev/null

          jq -n \
            --arg grade "$GRADE" \
            --arg subject "$SUBJECT" \
            --arg url "$YOUTUBE_URL" \
            --slurpfile analysis "$E2E_OUTPUT/analysis.json" \
            '{grade:$grade, subject:$subject, source:{type:"youtube", title:($analysis[0].videoTitle // ""), url:$url}, analysis:$analysis[0]}' \
            > "$RUNNER_TEMP/activity-request.json"

          c2_start=$(date +%s)
          c2_status=$(curl --silent --show-error \
            --output "$E2E_OUTPUT/activity.json" \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/activity-request.json" \
            http://127.0.0.1:8080/v1/activities/generate)
          c2_end=$(date +%s)
          echo "$((c2_end - c2_start))" > "$E2E_OUTPUT/c2-duration-seconds.txt"

          if [ "$c2_status" -lt 200 ] || [ "$c2_status" -ge 300 ]; then
            echo "C2 returned HTTP $c2_status."
            exit 1
          fi
          jq -e 'type == "object" and (.activityType | type == "string" and length > 0) and (.themes | type == "array" and length > 0) and ([.themes[].questions[]?] | length > 0)' \
            "$E2E_OUTPUT/activity.json" > /dev/null

      - name: Criar relatório legível
        if: always()
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          SUBJECT: ${{ inputs.subject }}
          GRADE: ${{ inputs.grade }}
        run: |
          analysis="$E2E_OUTPUT/analysis.json"
          activity="$E2E_OUTPUT/activity.json"
          title="não disponível"
          themes="não disponível"
          theme_count=0
          question_count=0
          true_count=0
          false_count=0
          c1_warnings="não disponível"
          c2_warnings="não disponível"
          c1_duration="não disponível"
          c2_duration="não disponível"

          if jq -e 'type == "object"' "$analysis" > /dev/null 2>&1; then
            title=$(jq -r '.videoTitle // "não disponível"' "$analysis")
            themes=$(jq -r '[.themes[]?.name] | if length == 0 then "nenhum" else join(", ") end' "$analysis")
            theme_count=$(jq -r '[.themes[]?] | length' "$analysis")
            c1_warnings=$(jq -r '[.warnings[]?] | if length == 0 then "nenhum" else join("; ") end' "$analysis")
          fi
          if jq -e 'type == "object"' "$activity" > /dev/null 2>&1; then
            question_count=$(jq -r '[.themes[]?.questions[]?] | length' "$activity")
            true_count=$(jq -r '[.themes[]?.questions[]? | select(.answer == true)] | length' "$activity")
            false_count=$(jq -r '[.themes[]?.questions[]? | select(.answer == false)] | length' "$activity")
            c2_warnings=$(jq -r '[.warnings[]?] | if length == 0 then "nenhum" else join("; ") end' "$activity")
          fi
          if [ -f "$E2E_OUTPUT/c1-duration-seconds.txt" ]; then
            c1_duration="$(cat "$E2E_OUTPUT/c1-duration-seconds.txt") s"
          fi
          if [ -f "$E2E_OUTPUT/c2-duration-seconds.txt" ]; then
            c2_duration="$(cat "$E2E_OUTPUT/c2-duration-seconds.txt") s"
          fi

          {
            echo "# Relatório E2E pedagógico"
            echo
            echo "- URL utilizada: $YOUTUBE_URL"
            echo "- Disciplina: $SUBJECT"
            echo "- Ano: $GRADE"
            echo "- Título detectado: $title"
            echo "- Temas encontrados pela C1: $themes"
            echo "- Quantidade de temas: $theme_count"
            echo "- Quantidade total de questões: $question_count"
            echo "- Distribuição true/false: $true_count verdadeiras / $false_count falsas"
            echo "- Warnings da C1: $c1_warnings"
            echo "- Warnings da C2: $c2_warnings"
            echo "- Modelo Gemini usado: $GEMINI_MODEL"
            echo "- Duração aproximada da C1: $c1_duration"
            echo "- Duração aproximada da C2: $c2_duration"
          } > "$E2E_OUTPUT/REPORT.md"

          rm -f "$E2E_OUTPUT/c1-duration-seconds.txt" "$E2E_OUTPUT/c2-duration-seconds.txt"

      - name: Publicar resultados para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Estude-Noah-E2E-Result
          path: |
            e2e-output/analysis.json
            e2e-output/activity.json
            e2e-output/REPORT.md
          if-no-files-found: warn
          retention-days: 14

      - name: Encerrar backend local
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/estude-noah-backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/estude-noah-backend.pid")" 2>/dev/null || true
          fi

      - name: Propagar falha da validação E2E
        if: always() && steps.e2e.outcome == 'failure'
        run: |
          echo "A validação E2E falhou; consulte o artifact Estude-Noah-E2E-Result."
          exit 1
