name: Gerar APK - Estude Noah

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "=== Plataformas instaladas ==="
          ls "$ANDROID_HOME/platforms"
          echo "=== Build Tools instalados ==="
          ls "$ANDROID_HOME/build-tools"

      - name: Configurar Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Testar e compilar APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleSideload --stacktrace

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Estude-Noah-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK sideload com Play Integrity
        uses: actions/upload-artifact@v4
        with:
          name: Estude-Noah-Sideload-APK
          path: app/build/outputs/apk/sideload/app-sideload.apk
          if-no-files-found: error
          retention-days: 30

